[package]
name = "agentlatch"
version = "0.1.0"
edition = "2024"
description = "Lightweight coordination and collision prevention for coding agents."
license = "MIT"

[[bin]]
name = "agentlatch"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
